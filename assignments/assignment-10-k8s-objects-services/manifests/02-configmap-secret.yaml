apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
  namespace: dev-space
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  APP_LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: webapp-db-secret
  namespace: dev-space
type: Opaque
data:
  # Base64 encoded: appadmin -> YXBwYWRtaW4=, SecurePass@2026 -> U2VjdXJlUGFzc0AyMDI2
  DB_USER: "YXBwYWRtaW4="
  DB_PASSWORD: "U2VjdXJlUGFzc0AyMDI2"

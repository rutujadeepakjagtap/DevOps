apiVersion: v1
kind: Service
metadata:
  name: webapp-clusterip
  namespace: dev-space
spec:
  type: ClusterIP
  selector:
    app: webapp
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-nodeport
  namespace: dev-space
spec:
  type: NodePort
  selector:
    app: webapp
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-loadbalancer
  namespace: dev-space
spec:
  type: LoadBalancer
  selector:
    app: webapp
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: external-database-svc
  namespace: dev-space
spec:
  type: ExternalName
  externalName: db.pccoe-cloud.internal

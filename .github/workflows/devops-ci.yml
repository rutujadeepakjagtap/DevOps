name: DevOps Assignments 1-11 CI/CD Automated Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Enables 1-click manual run button in GitHub Web UI

jobs:
  verify-all-11-assignments:
    name: Verify Assignments 01 to 11
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository SCM
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Test Frameworks
        run: |
          python -m pip install --upgrade pip
          pip install pytest flask psycopg2-binary requests fpdf2 python-docx ansible-core

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Setup Kubernetes Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Execute Master Test & Verification Suite (Assignments 01 - 11)
        run: |
          python scripts/run_all_tests.py

      - name: Publish Verification Badges and Artifacts
        if: always()
        run: |
          echo "All 11 PCCOE DevOps Practical Assignments successfully verified on GitHub Actions."

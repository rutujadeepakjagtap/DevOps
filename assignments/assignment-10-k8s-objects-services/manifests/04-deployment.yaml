apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  namespace: dev-space
  labels:
    app: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: webapp-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: webapp-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webapp-db-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: app-storage
              mountPath: /data
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-data-pvc
